<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: rgb(255, 255, 219);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-box {
            background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
            padding: 30px;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(255, 181, 0, 0.4);
        }
        .register-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 8px;
            padding-left: 40px;
        }
        .btn-success {
            background-color: #FF9800;
            border: none;
        }

        .btn-success:hover {
            background-color: #F57C00;
        }
        .btn-secondary {
            background-color: #2c2c3c;
            border: none;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Реєстрація</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Ім’я користувача" required>
            </div>
            <div class="form-group">
                <input type="password" name="password1" class="form-control" placeholder="Пароль" required>
            </div>
            <div class="form-group">
                <input type="password" name="password2" class="form-control" placeholder="Підтвердження пароля" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-2">Зареєструватися</button>
        </form>
    </div>
</body>
</html>
