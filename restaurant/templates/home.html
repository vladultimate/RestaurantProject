<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Головна сторінка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: rgb(255, 255, 219);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
            padding: 20px;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 15px rgba(255, 181, 0, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-weight: bold;
        }

        .auth-buttons a {
            margin-left: 10px;
            border-radius: 10px;
            padding: 8px 16px;
            text-decoration: none;
        }

        .btn-success {
            background-color: #FF9800;
            color: white;
            border: none;
        }

        .btn-success:hover {
            background-color: #F57C00;
            color: white;
        }

        .btn-secondary {
            background-color: #2c2c3c;
            color: white;
            border: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .menu-button {
            font-size: 20px;
            padding: 15px 30px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Головна сторінка</h1>
        <div class="auth-buttons">
            {% if not request.user.is_authenticated %}
                <a href="{% url 'register' %}" class="btn btn-success">Зареєструватися</a>
                <a href="{% url 'login' %}" class="btn btn-secondary">Увійти</a>
            {% else %}
                <span>Привіт, {{ request.user.username }}!</span>
            {% endif %}
            <a href="{% url 'menu' %}" class="btn-menu">Меню</a>
        </div>
    </header>
</body>
</html>
