<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Оформлення замовлення</title>
    <style>
        body {
            background: linear-gradient(135deg, #FFF9C4, #FFE082);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 420px;
            background: #fff;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            animation: fadeIn 0.5s ease-in-out;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #E65100;
            font-size: 24px;
        }

        form p {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #FF9800;
            box-shadow: 0 0 6px rgba(255,152,0,0.4);
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #FF9800, #F57C00);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255,152,0,0.4);
        }

        .btn:hover {
            background: linear-gradient(135deg, #FFB74D, #FB8C00);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(255,152,0,0.6);
        }

        .btn:active {
            transform: scale(0.97);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Оформлення замовлення</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">📦 Підтвердити</button>
        </form>
    </div>
</body>
</html>
