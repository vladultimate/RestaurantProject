<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Додати страву</title>
    <style>
        body {
            background: #fffbe5;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        header {
            background: linear-gradient(135deg, #FFD54F 0%, #FFB300 100%);
            padding: 16px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 12px rgba(255,181,0,0.45);
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 0 10px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"],
        textarea,
        select {
            padding: 8px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px 0;
            border-radius: 9px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #FF6F00 0%, #FF9800 100%);
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s, transform 0.2s;
        }

        .btn:hover {
            background: linear-gradient(135deg, #FF8F00 0%, #FFB74D 100%);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Змінити Страву</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Змінити</button>
        </form>
    </div>
</div>

</body>
</html>
